name: Hourly Jira sync

on:
  schedule:
    # Avoid :00 — GitHub Actions scheduled runs queue up heavily right at the
    # top of the hour and can be delayed or dropped; an off-the-hour minute
    # (:17) runs far more reliably.
    - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/sync
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_PROTECTION_BYPASS }}" \
            "${{ secrets.APP_URL }}/api/cron/sync")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            exit 1
          fi
